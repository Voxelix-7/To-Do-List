<!DOCTYPE html>
<html>
  <head>
    <title>ToDoList</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <div class="app">
      <h1 id="header">To Do:</h1>
      <input type="text" id="taskInput" placeholder="Write your next task">
      <button id="taskBtn" class="appBtn">Add Task</button>
      <p>Total tasks: <span id="taskCount">0</span></p>
      <ul id="taskList"></ul>
    </div>

    <script src="script.js"></script>
  </body>
</html>
